name: Migrate production

# 本番の DB に migration を流す。人が手動で実行したときだけ (main のみ・environment production の承認)。
# runner から直接繋ぐ。接続文字列は org の secret ALC_MIGRATE_DATABASE_URL (repo に値を書かない)。
# 流す順: build → --status (読むだけ) → 適用 → --check (未適用 0)。
# alc-migrate は接続文字列・接続先を出さないので、stdout をそのまま summary に出してよい。
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: migrate-production
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  migrate:
    name: migrate production
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    env:
      DATABASE_URL: ${{ secrets.ALC_MIGRATE_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.92.0
      - uses: swatinem/rust-cache@v2
        with:
          shared-key: alc-migrations

      - name: Build alc-migrate
        run: cargo build --release --locked --features cli --bin alc-migrate

      # 適用前に、読むだけで未適用を確かめる
      - name: Status (before)
        run: |
          rc=0
          out=$(target/release/alc-migrate --status 2>&1) || rc=$?
          echo "$out"
          { echo '### status (before) (exit '"$rc"')'; echo '```'; echo "$out"; echo '```'; } >>"$GITHUB_STEP_SUMMARY"
          exit "$rc"

      - name: Apply
        run: |
          rc=0
          out=$(target/release/alc-migrate 2>&1) || rc=$?
          echo "$out"
          { echo '### apply (exit '"$rc"')'; echo '```'; echo "$out"; echo '```'; } >>"$GITHUB_STEP_SUMMARY"
          exit "$rc"

      - name: Check (after)
        run: |
          rc=0
          out=$(target/release/alc-migrate --check 2>&1) || rc=$?
          echo "$out"
          { echo '### check (after) (exit '"$rc"')'; echo '```'; echo "$out"; echo '```'; } >>"$GITHUB_STEP_SUMMARY"
          exit "$rc"
