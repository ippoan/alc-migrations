name: CI

on:
  pull_request:
  push:
    branches: [main]
  # PR を出す前に、branch を指定して流す (PR は緑になると自動でマージされるため)。
  # safety と auto-merge は pull_request のときだけ動くので、ここからは test と replay だけが走る
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.92.0
        with:
          components: rustfmt, clippy
      - uses: swatinem/rust-cache@v2
        with:
          shared-key: alc-migrations
      - run: cargo fmt --check
      - run: cargo clippy --all-features -- -D warnings
      - run: cargo test
      # migrate.yml の contract 歯止め (ci/check_contract.sh) の陰性・陽性の対照
      - run: bash ci/check_contract_test.sh

  # 空の DB に 0 から全 migration を流し、本番と同じ順 (init → migrate → grants) で通ることを確認する。
  # 軸は「migration を流すロール」= 表の所有者になるロール:
  #   * postgres    — superuser が流す (テスト用 DB・staging と同じ)。表の所有者は postgres で、
  #                   alc_api_app も alc_api_rt も所有者でない。migration の GRANT 漏れはこの軸でしか
  #                   見つからない (所有者には GRANT が要らないため)
  #   * alc_api_app — 本番と同じ。alc_api_app が流して全表の所有者になり、backend は所有者でない
  #                   alc_api_rt で繋ぐ。所有者には FORCE の無い表のポリシーが掛からないので、
  #                   RLS が実際に掛かることは、この軸で alc_api_rt から確かめる
  replay:
    name: replay
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        migrate_as: [postgres, alc_api_app]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      PGPASSWORD: test
      PGHOST: localhost
      PGUSER: postgres
      PGDATABASE: postgres
      # migration を流す接続 (軸のロール。パスワードは CI の使い捨て)
      DATABASE_URL: postgresql://${{ matrix.migrate_as }}:test@localhost:5432/postgres
      # RLS の検査を流すロール = その軸で表の所有者でない、アプリのロール
      APP_ROLE: ${{ matrix.migrate_as == 'alc_api_app' && 'alc_api_rt' || 'alc_api_app' }}
      # 表の所有者が alc_api_app の軸だけ、所有者の接続から dev の行が見えてしまうこと (いまの状態の記録) も確かめる
      OWNER_ROLE: ${{ matrix.migrate_as == 'alc_api_app' && 'alc_api_app' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.92.0
      - uses: swatinem/rust-cache@v2
        with:
          shared-key: alc-migrations
      - name: init_local_db.sql
        run: psql -v ON_ERROR_STOP=1 -f scripts/init_local_db.sql
      # 本番で migration の外で済ませてあること (alc_api_app が繋げて表を作れる / alc_api_rt が在り
      # schema の USAGE を持つ) を、superuser が再現する
      - name: setup_owner_axis.sql (alc_api_app の軸だけ)
        if: matrix.migrate_as == 'alc_api_app'
        run: psql -v ON_ERROR_STOP=1 -v app_password="$PGPASSWORD" -f ci/setup_owner_axis.sql
      - run: cargo build --features cli --bin alc-migrate
      # 適用前: --status は何も書かず exit 0 で全件を未適用として出す。--check は未適用が在るので exit 1 (陽性対照)
      - name: alc-migrate --status / --check (適用前)
        run: |
          got=$(cargo run -q --features cli --bin alc-migrate -- --status)
          printf '%s\n' "$got" | tail -n 3
          test "$(printf '%s\n' "$got" | tail -n 1)" = "pending: 167"
          if cargo run -q --features cli --bin alc-migrate -- --check >/dev/null; then
            echo "--check は未適用が在れば exit 1 のはず"
            exit 1
          fi
      - name: migrate (0 -> latest) as ${{ matrix.migrate_as }}
        run: cargo run --features cli --bin alc-migrate
      - name: alc-migrate --status / --check (適用後)
        run: |
          got=$(cargo run -q --features cli --bin alc-migrate -- --status)
          echo "$got"
          test "$got" = "pending: 0"
          cargo run -q --features cli --bin alc-migrate -- --check
      - name: local_app_grants.sql
        run: psql -v ON_ERROR_STOP=1 -f scripts/local_app_grants.sql
      - name: applied count
        run: |
          got=$(psql -At -F ' | ' -c "SELECT count(*), max(version) FROM _sqlx_migrations" || true)
          if [ -z "$got" ]; then
            got=$(psql -At -F ' | ' -c "SELECT count(*), max(version) FROM alc_api._sqlx_migrations")
          fi
          echo "$got"
          test "$got" = "167 | 168"
      - name: table owner
        run: |
          got=$(psql -At -c "SELECT DISTINCT relowner::regrole FROM pg_class WHERE relnamespace = 'alc_api'::regnamespace AND relkind IN ('r', 'p')")
          echo "$got"
          test "$got" = "${{ matrix.migrate_as }}"
      # ポリシーを書いたが backend (alc_api_rt) に効いていない、を落とす。何も変更しない。
      # 1 文の SELECT で、違反を 1 行ずつ返す (0 行なら合格)。backend も同じ 1 文を流す
      # (alc_migrations::RLS_INVARIANTS_QUERY)。ON_ERROR_STOP を外さない — 無いと SQL のエラー
      # (権限・構文) でも出力が空になり、合格に見える
      - name: check RLS invariants
        run: |
          got=$(psql -v ON_ERROR_STOP=1 -At -f ci/check_rls_invariants.sql)
          if [ -n "$got" ]; then
            echo "RLS の不変条件の違反:"
            echo "$got"
            exit 1
          fi
          echo "ok: RLS の不変条件 (検査 0〜9) の違反は 0 件"
      # 同じ 1 文を、backend が繋ぐ実行用ロールで流す (実行用ロールからカタログが読めることの確認)。
      # ログインではなく SET ROLE (postgres の軸では alc_api_rt が NOLOGIN)。出力の 1 行目で、
      # 実際に alc_api_rt として流れたことを確かめる。違反が在れば 2 行目以降に出て落ちる
      - name: check RLS invariants as alc_api_rt (SET ROLE)
        run: |
          got=$(psql -v ON_ERROR_STOP=1 -q -At \
            -c 'SET ROLE alc_api_rt' \
            -c "SELECT 'current_user = ' || current_user" \
            -f ci/check_rls_invariants.sql)
          echo "$got"
          test "$got" = "current_user = alc_api_rt"
      # 陽性対照: 違反を作れば行が出ること。alc_api_rt を BYPASSRLS にすると検査 4 が 1 行返す。
      # 1 transaction で流して ROLLBACK するので、DB には何も残らない (残っていないことも確かめる)。
      # ロールの属性を変えるので、APP_ROLE ではなく既定の postgres で流す
      - name: check RLS invariants (陽性対照。BYPASSRLS で検査 4 の行が出る)
        run: |
          got=$(psql -v ON_ERROR_STOP=1 -q -At -F ' | ' \
            -c 'BEGIN' \
            -c 'ALTER ROLE alc_api_rt BYPASSRLS' \
            -f ci/check_rls_invariants.sql \
            -c 'ROLLBACK')
          echo "$got"
          printf '%s\n' "$got" | grep -q '^4 | role alc_api_rt | '
          after=$(psql -v ON_ERROR_STOP=1 -At -c "SELECT rolbypassrls FROM pg_roles WHERE rolname = 'alc_api_rt'")
          echo "rolbypassrls = $after"
          test "$after" = "f"
      # 陽性対照 (検査 6・7・8): 違反を作れば、その番号の行が出ること。検査ごとに 1 transaction で流して
      # ROLLBACK するので、DB には何も残らない (最後に、検査が 0 行に戻っていることも確かめる)。
      #   6: view を作る
      #   7: 許可リストに無い SECURITY DEFINER の関数を PUBLIC に GRANT する / search_path の固定を外す
      #   8: 式が true のポリシーを持たない RLS 有効の表に、USING (true) のポリシーを作る
      - name: check RLS invariants (陽性対照。検査 6・7・8 の行が出る)
        run: |
          got=$(psql -v ON_ERROR_STOP=1 -q -At -F ' | ' \
            -c 'BEGIN' \
            -c 'CREATE VIEW alc_api.ci_positive_control AS SELECT 1 AS one' \
            -f ci/check_rls_invariants.sql \
            -c 'ROLLBACK')
          echo "$got"
          printf '%s\n' "$got" | grep -q '^6 | view ci_positive_control | '

          got=$(psql -v ON_ERROR_STOP=1 -q -At -F ' | ' \
            -c 'BEGIN' \
            -c 'GRANT EXECUTE ON FUNCTION alc_api.migration_status() TO PUBLIC' \
            -c 'ALTER FUNCTION alc_api.migration_status() RESET search_path' \
            -f ci/check_rls_invariants.sql \
            -c 'ROLLBACK')
          echo "$got"
          printf '%s\n' "$got" | grep -q '^7 | function migration_status() | .*PUBLIC が EXECUTE'
          printf '%s\n' "$got" | grep -q '^7 | function migration_status() | .*search_path が固定されていない'

          tbl=$(psql -v ON_ERROR_STOP=1 -At -c "SELECT c.relname FROM pg_class c WHERE c.relnamespace = 'alc_api'::regnamespace AND c.relkind IN ('r', 'p') AND c.relrowsecurity AND NOT EXISTS (SELECT 1 FROM pg_policies p WHERE p.schemaname = 'alc_api' AND p.tablename = c.relname AND (p.qual = 'true' OR p.with_check = 'true')) ORDER BY c.relname LIMIT 1")
          echo "table = $tbl"
          test -n "$tbl"
          got=$(psql -v ON_ERROR_STOP=1 -q -At -F ' | ' \
            -c 'BEGIN' \
            -c "CREATE POLICY ci_positive_control ON alc_api.\"$tbl\" FOR SELECT USING (true)" \
            -f ci/check_rls_invariants.sql \
            -c 'ROLLBACK')
          echo "$got"
          printf '%s\n' "$got" | grep -q "^8 | table $tbl | .*ci_positive_control (SELECT)"

          after=$(psql -v ON_ERROR_STOP=1 -At -f ci/check_rls_invariants.sql)
          test -z "$after"
          echo "ok: ROLLBACK の後、違反は 0 件に戻っている"
      # 陽性対照 (検査 9): COALESCE の最後の引数が列 tenant_id そのもののポリシーを作れば、9 の行だけが出ること
      # (検査 8 = true / 検査 2 = ポリシー無し には当たらない)。1 transaction で流して ROLLBACK するので、
      # DB には何も残らない (最後に、検査が 0 行に戻っていることも確かめる)。
      # 検査 9 はこの 1 つの綴りだけを捕まえる (別の綴りは捕まえない)
      - name: check RLS invariants (陽性対照。検査 9 の行が出る)
        run: |
          tbl=$(psql -v ON_ERROR_STOP=1 -At -c "SELECT c.relname FROM pg_class c WHERE c.relnamespace = 'alc_api'::regnamespace AND c.relkind IN ('r', 'p') AND c.relrowsecurity AND EXISTS (SELECT 1 FROM pg_attribute a WHERE a.attrelid = c.oid AND a.attname = 'tenant_id' AND NOT a.attisdropped) AND NOT EXISTS (SELECT 1 FROM pg_policies p WHERE p.schemaname = 'alc_api' AND p.tablename = c.relname AND (p.qual = 'true' OR p.with_check = 'true')) ORDER BY c.relname LIMIT 1")
          echo "table = $tbl"
          test -n "$tbl"
          got=$(psql -v ON_ERROR_STOP=1 -q -At -F ' | ' \
            -c 'BEGIN' \
            -c "CREATE POLICY ci_positive_control ON alc_api.\"$tbl\" FOR SELECT USING (tenant_id = COALESCE(NULLIF(current_setting('app.current_tenant_id', true), '')::uuid, tenant_id))" \
            -f ci/check_rls_invariants.sql \
            -c 'ROLLBACK')
          echo "$got"
          printf '%s\n' "$got" | grep -q "^9 | table $tbl | .*ci_positive_control (SELECT)"
          test "$(printf '%s\n' "$got" | grep -c .)" = "1"

          after=$(psql -v ON_ERROR_STOP=1 -At -f ci/check_rls_invariants.sql)
          test -z "$after"
          echo "ok: ROLLBACK の後、違反は 0 件に戻っている"
      # RLS まわりのいまの状態 (1 文の SELECT。1 行 1 列の JSON)。backend も同じ 1 文を流す
      # (alc_migrations::RLS_STATE_QUERY)。合否は決めない SQL なので、ここで確かめるのは形だけ:
      #   * superuser で流しても実行用ロール (SET ROLE alc_api_rt) で流しても、出力が完全に同じ
      #     (実行用ロールから policy の式・関数の設定まで読めている。並びが固定されている)
      #   * 自己整合: 組の count の合計 = table_count = pg_class を直接数えた値 (> 0)
      # 最後に、応答の大きさ (バイト数) と組の概要を出す
      - name: RLS state (どのロールで流しても同じ出力・自己整合)
        run: |
          as_super=$(psql -v ON_ERROR_STOP=1 -q -At -f ci/rls_state.sql)
          as_rt=$(psql -v ON_ERROR_STOP=1 -q -At \
            -c 'SET ROLE alc_api_rt' \
            -c "SELECT 'current_user = ' || current_user" \
            -f ci/rls_state.sql)
          test "$(printf '%s\n' "$as_super" | wc -l)" = "1"
          test "$(printf '%s\n' "$as_rt" | head -n 1)" = "current_user = alc_api_rt"
          test "$(printf '%s\n' "$as_rt" | tail -n +2)" = "$as_super"
          direct=$(psql -v ON_ERROR_STOP=1 -At -c "SELECT count(*) FROM pg_class WHERE relnamespace = 'alc_api'::regnamespace AND relkind IN ('r', 'p')")
          printf '%s\n' "$as_super" | jq -e --argjson direct "$direct" '
            .table_count > 0
            and .table_count == $direct
            and ([.tables[].count] | add) == .table_count
            and all(.tables[]; .count == (.names | length))'
          printf '%s\n' "$as_super" | jq -c '{table_count, groups: (.tables | length), views: (.views | length), security_definer_functions: (.security_definer_functions | length), sequences}'
          printf '%s\n' "$as_super" | jq -c '.tables[] | {count, rls_enabled, rls_forced, owner, runtime_role_can_act_as_owner, policies: (.policies | length), runtime_role_privileges, first: .names[0]}'
          echo "ok: 2 つのロールで同じ出力 / table_count = $direct / $(printf '%s' "$as_super" | wc -c) bytes"
      # 陽性対照: 状態を変えれば出力が変わること。RLS 有効・FORCE 無しの表を 1 つ選んで FORCE を付けると、
      # その表が rls_forced: true の組に出る (付ける前は出ていない)。1 transaction で流して ROLLBACK
      # するので、DB には何も残らない (残っていないことも確かめる)
      - name: RLS state (陽性対照。FORCE を付けた表が rls_forced の組に出る)
        run: |
          tbl=$(psql -v ON_ERROR_STOP=1 -At -c "SELECT relname FROM pg_class WHERE relnamespace = 'alc_api'::regnamespace AND relkind IN ('r', 'p') AND relrowsecurity AND NOT relforcerowsecurity ORDER BY relname LIMIT 1")
          echo "table = $tbl"
          test -n "$tbl"
          psql -v ON_ERROR_STOP=1 -q -At -f ci/rls_state.sql \
            | jq -e --arg tbl "$tbl" 'any(.tables[]; .rls_forced and (.names | index($tbl) != null)) | not'
          got=$(psql -v ON_ERROR_STOP=1 -q -At \
            -c 'BEGIN' \
            -c "ALTER TABLE alc_api.\"$tbl\" FORCE ROW LEVEL SECURITY" \
            -f ci/rls_state.sql \
            -c 'ROLLBACK')
          printf '%s\n' "$got" | jq -e --arg tbl "$tbl" 'any(.tables[]; .rls_forced and (.names | index($tbl) != null))'
          after=$(psql -v ON_ERROR_STOP=1 -At -c "SELECT relforcerowsecurity FROM pg_class WHERE oid = 'alc_api.\"$tbl\"'::regclass")
          echo "relforcerowsecurity = $after"
          test "$after" = "f"
      # 実物 = 期待する状態 (ci/expected_rls_state.json。backend も同じファイルと本番の実物を比べる —
      # alc_migrations::RLS_EXPECTED_STATE)。正規化の規則は 1 つ: jq -S 'del(.tables[].owner)'
      # (所有者のロール名は軸で違うので外す。2 軸とも同じファイルと、読み替えなしで比べる)。
      # RLS の状態を変える migration は、このファイルの差分として同じ PR に現れる。
      # 最後に、作り直しの script が同じファイルを作ること (script と比較の規則がずれていない) も確かめる
      - name: RLS state = ci/expected_rls_state.json
        run: |
          state=$(psql -v ON_ERROR_STOP=1 -q -At -f ci/rls_state.sql)
          test -n "$state"
          test "$(printf '%s\n' "$state" | wc -l)" = "1"
          actual=$(printf '%s\n' "$state" | jq -S 'del(.tables[].owner)')
          if ! printf '%s\n' "$actual" | diff -u ci/expected_rls_state.json -; then
            echo "RLS の状態が ci/expected_rls_state.json と食い違っています (- 期待 / + 実物)。"
            echo "意図した変更なら ci/update_expected_rls_state.sh で作り直し、差分を同じ PR に入れてください。"
            exit 1
          fi
          bash ci/update_expected_rls_state.sh
          git diff --exit-code -- ci/expected_rls_state.json
          echo "ok: 実物 = 期待する状態 ($(wc -c < ci/expected_rls_state.json) bytes)"
      # 陽性対照: 状態が履歴からずれれば (drift)、上の比較が食い違うこと。ポリシーを 1 本選んで DROP すると、
      # policy_names からその名前が消え、期待する状態との diff が出る。1 transaction で流して ROLLBACK
      # するので、DB には何も残らない (残っていないことも確かめる)
      - name: RLS state (陽性対照。ポリシーを DROP すると期待する状態と食い違う)
        run: |
          pol=$(psql -v ON_ERROR_STOP=1 -At -F ' ' -c "SELECT tablename, policyname FROM pg_policies WHERE schemaname = 'alc_api' ORDER BY tablename, policyname LIMIT 1")
          tbl=${pol%% *}
          name=${pol#* }
          echo "table = $tbl / policy = $name"
          test -n "$tbl"
          test -n "$name"
          jq -e --arg tbl "$tbl" --arg name "$name" '.policy_names[$tbl] | index($name) != null' ci/expected_rls_state.json
          state=$(psql -v ON_ERROR_STOP=1 -q -At \
            -c 'BEGIN' \
            -c "DROP POLICY \"$name\" ON alc_api.\"$tbl\"" \
            -f ci/rls_state.sql \
            -c 'ROLLBACK')
          test "$(printf '%s\n' "$state" | wc -l)" = "1"
          actual=$(printf '%s\n' "$state" | jq -S 'del(.tables[].owner)')
          printf '%s\n' "$actual" | jq -e --arg tbl "$tbl" --arg name "$name" '.policy_names[$tbl] | index($name) == null'
          if printf '%s\n' "$actual" | diff -u ci/expected_rls_state.json - > /tmp/rls_state_drift.diff; then
            echo "ポリシーを DROP したのに、期待する状態と食い違いません"
            exit 1
          fi
          cat /tmp/rls_state_drift.diff
          after=$(psql -v ON_ERROR_STOP=1 -q -At -f ci/rls_state.sql | jq -S 'del(.tables[].owner)')
          printf '%s\n' "$after" | diff -u ci/expected_rls_state.json -
          echo "ok: ROLLBACK の後、実物 = 期待する状態に戻っている"
      # 対照 (161): 9 表のポリシーと FORCE を履歴の定義から崩した状態に 161 を当てると、期待する状態に戻ること。
      # 崩すのは superuser (式は USING (tenant_id IS NOT NULL)。true にすると検査 8 に当たる)、161 は
      # 軸のロール (= 表の所有者) で当てる。1 回の psql・1 transaction で流して ROLLBACK するので、
      # DB には何も残らない (残っていないことも確かめる)。出力は rls_state.sql の 2 行:
      # 1 行目 = 崩した後 (期待と食い違う) / 2 行目 = 161 の後 (期待と一致)
      - name: RLS state (対照。崩した 9 表に 161 を当てると期待する状態に戻る)
        run: |
          break_sql=''
          for pair in \
            employees:tenant_isolation_employees \
            dtako_offices:dtako_offices_tenant \
            dtako_vehicles:dtako_vehicles_tenant \
            dtako_event_classifications:dtako_event_cls_tenant \
            dtako_operations:dtako_ops_tenant \
            dtako_daily_work_hours:dtako_dwh_tenant \
            dtako_daily_work_segments:dtako_dws_tenant \
            dtako_upload_history:dtako_upload_tenant \
            dtako_scrape_history:dtako_scrape_history_tenant; do
            tbl=${pair%%:*}
            name=${pair#*:}
            break_sql="$break_sql DROP POLICY $name ON alc_api.$tbl; CREATE POLICY $name ON alc_api.$tbl USING (tenant_id IS NOT NULL); ALTER TABLE alc_api.$tbl FORCE ROW LEVEL SECURITY;"
          done
          state=$(psql -v ON_ERROR_STOP=1 -q -At \
            -c 'BEGIN' \
            -c "$break_sql" \
            -f ci/rls_state.sql \
            -c 'SET LOCAL ROLE ${{ matrix.migrate_as }}' \
            -f migrations/161_realign_tenant_policies.sql \
            -c 'RESET ROLE' \
            -f ci/rls_state.sql \
            -c 'ROLLBACK')
          test "$(printf '%s\n' "$state" | wc -l)" = "2"
          broken=$(printf '%s\n' "$state" | sed -n 1p | jq -S 'del(.tables[].owner)')
          realigned=$(printf '%s\n' "$state" | sed -n 2p | jq -S 'del(.tables[].owner)')
          if printf '%s\n' "$broken" | diff -u ci/expected_rls_state.json - > /tmp/rls_state_broken.diff; then
            echo "9 表を崩したのに、期待する状態と食い違いません"
            exit 1
          fi
          head -n 20 /tmp/rls_state_broken.diff
          if ! printf '%s\n' "$realigned" | diff -u ci/expected_rls_state.json -; then
            echo "161 を当てた後の状態が ci/expected_rls_state.json と食い違っています (- 期待 / + 実物)"
            exit 1
          fi
          echo "ok: 崩した 9 表は、161 を当てると期待する状態に戻る"
          after=$(psql -v ON_ERROR_STOP=1 -q -At -f ci/rls_state.sql | jq -S 'del(.tables[].owner)')
          printf '%s\n' "$after" | diff -u ci/expected_rls_state.json -
          echo "ok: ROLLBACK の後、実物 = 期待する状態に戻っている"
      # アプリのロール (その軸で所有者でないロール) で dev の軸 (153・155・156)・IT点呼 (154)・
      # 判定の確認の方法 (157) を確かめる。alc_api_app の軸では、所有者の接続だと dev の行が
      # 見えてしまうこと (いまの状態の記録) も確かめる。1 transaction で流して ROLLBACK するので
      # DB には何も残らない
      - name: check dev axis / IT点呼 (153-157) as ${{ env.APP_ROLE }}
        run: |
          psql -v ON_ERROR_STOP=1 -v app_role="$APP_ROLE" ${OWNER_ROLE:+-v owner_role="$OWNER_ROLE"} \
            -f ci/check_dev_axis_and_it_tenko.sql
      # 実行用ロール alc_api_rt で、認証前・テナント横断の関数 (158) を tenant context 無しで呼べること、
      # 表への直接の問い合わせには RLS が掛かること、適用履歴は関数 (160) からだけ読めること
      - name: check runtime role (158・160)
        run: psql -v ON_ERROR_STOP=1 -f ci/check_runtime_role.sql
      # テナント分離のポリシーが、実行用ロール alc_api_rt に対して実際の行を止めること。tenant_id を持つ表を
      # カタログから全部引き (表を列挙しない)、テナント 2 つの行を入れて、a. 未設定では読めない /
      # b. 別のテナントの行が見えず自分の行は見える / c. 別のテナントの tenant_id での INSERT が 42501、を確かめる。
      # 違反を 1 行ずつ返す (0 行なら合格。行を入れられない表も違反)。数の内訳は NOTICE (stderr) に出る。
      # 1 transaction で流して ROLLBACK するので、DB には何も残らない。ON_ERROR_STOP を外さない。
      # 合否は stdout だけで決める (stderr は別に取り、混ぜない)。「書きの保留」(未判断の 2 表) は違反ではなく
      # stderr の WARNING「check_rls_rows: 保留: …」で出るので、それを注釈 (::warning) にする。落とさない
      - name: check RLS rows (tenant_id を持つ全部の表を、alc_api_rt から実際の行で)
        run: |
          err=$(mktemp)
          got=$(psql -v ON_ERROR_STOP=1 -q -At -F ' | ' \
            -c 'BEGIN' \
            -f ci/check_rls_rows.sql \
            -c 'ROLLBACK' 2> "$err") || { cat "$err" >&2; exit 1; }
          cat "$err" >&2
          if [ -n "$got" ]; then
            echo "行で確かめた RLS の違反:"
            echo "$got"
            exit 1
          fi
          echo "ok: 行で確かめた RLS (検査 a・b・c) の違反は 0 件"
          { grep -o 'check_rls_rows: 保留: .*' "$err" || true; } | while IFS= read -r line; do
            echo "::warning title=RLS の書きの保留::$line"
          done
      # 陽性対照: 式が true ではないが、テナントを縛らないポリシーを足せば、違反の行が出ること。
      #   読み: vein_templates に SELECT の USING (tenant_id IS NOT NULL) → 検査 a・b の行が出る。
      #         同じ壊し方は check_rls_invariants.sql の検査 8 (式が true そのもの) では落ちない (空のまま) —
      #         行で確かめる検査だけが捕まえる
      #   書き: employees に INSERT の WITH CHECK (tenant_id IS NOT NULL) → 検査 c の行が出る
      # 対照ごとに 1 transaction で流して ROLLBACK するので、DB には何も残らない
      # (最後に、検査が 0 行に戻っていること・ポリシーと行が残っていないことも確かめる)
      - name: check RLS rows (陽性対照。テナントを縛らないポリシーで検査 a・b・c の行が出る)
        run: |
          read_ctl='CREATE POLICY p727_ctl_read ON alc_api.vein_templates FOR SELECT USING (tenant_id IS NOT NULL)'
          got=$(psql -v ON_ERROR_STOP=1 -q -At -F ' | ' \
            -c 'BEGIN' \
            -c "$read_ctl" \
            -f ci/check_rls_rows.sql \
            -c 'ROLLBACK')
          echo "$got"
          printf '%s\n' "$got" | grep -q '^a | table vein_templates | '
          printf '%s\n' "$got" | grep -q '^b | table vein_templates | '
          inv=$(psql -v ON_ERROR_STOP=1 -q -At -F ' | ' \
            -c 'BEGIN' \
            -c "$read_ctl" \
            -f ci/check_rls_invariants.sql \
            -c 'ROLLBACK')
          test -z "$inv"
          echo "ok: 同じ壊し方で、check_rls_invariants.sql は 0 行のまま"

          got=$(psql -v ON_ERROR_STOP=1 -q -At -F ' | ' \
            -c 'BEGIN' \
            -c 'CREATE POLICY p727_ctl_write ON alc_api.employees FOR INSERT WITH CHECK (tenant_id IS NOT NULL)' \
            -f ci/check_rls_rows.sql \
            -c 'ROLLBACK')
          echo "$got"
          printf '%s\n' "$got" | grep -q '^c | table employees | '

          after=$(psql -v ON_ERROR_STOP=1 -q -At -F ' | ' -c 'BEGIN' -f ci/check_rls_rows.sql -c 'ROLLBACK')
          test -z "$after"
          left=$(psql -v ON_ERROR_STOP=1 -At -c "SELECT (SELECT count(*) FROM pg_policies WHERE schemaname = 'alc_api' AND policyname LIKE 'p727\_ctl\_%') + (SELECT count(*) FROM alc_api.tenants WHERE name LIKE 'ci check rls rows %')")
          echo "left = $left"
          test "$left" = "0"
          echo "ok: ROLLBACK の後、違反は 0 件に戻っている (ポリシーも行も残っていない)"

  # migration SQL を足した PR だけ走る。警告とラベルだけで止めない
  safety:
    name: safety
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Collect added migration files
        id: collect
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # SHA は GitHub 生成の 40-char hex で injection リスクなしだが、念のため env 経由で受ける。
          # PR で追加 (Added) されたファイルのみ対象。変更 (Modified) は適用済み migration の
          # 改変禁止ルールで別途禁じているのでここでは扱わない。
          added=$(git diff --name-only --diff-filter=A "$BASE_SHA"..."$HEAD_SHA" -- 'migrations/*.sql' || true)
          if [[ -z "$added" ]]; then
            echo "added_count=0" >> "$GITHUB_OUTPUT"
            echo "no added migrations"
            exit 0
          fi
          {
            echo "added_count=$(echo "$added" | wc -l | tr -d ' ')"
            echo 'added_files<<EOF_ADDED'
            echo "$added"
            echo 'EOF_ADDED'
          } >> "$GITHUB_OUTPUT"
          echo "added files:"
          echo "$added"

      - name: Run safety check
        id: check
        if: steps.collect.outputs.added_count != '0'
        env:
          ADDED_FILES: ${{ steps.collect.outputs.added_files }}
        run: |
          set -euo pipefail
          # ファイル名は git tracked path だが PR 作成者が任意のファイル名を選べるので
          # GitHub Actions 式で直接展開せず env 経由で受ける (command injection 防止)。
          # mapfile + quoted "${files[@]}" で空白/特殊文字を含むパスも安全に渡す。
          mapfile -t files <<< "$ADDED_FILES"
          report=$(bash .github/scripts/migration-safety-check.sh "${files[@]}")
          {
            echo 'report<<EOF_REPORT'
            echo "$report"
            echo 'EOF_REPORT'
          } >> "$GITHUB_OUTPUT"
          echo "$report"

      - name: Post sticky PR comment
        if: steps.collect.outputs.added_count != '0'
        uses: actions/github-script@v7
        env:
          REPORT: ${{ steps.check.outputs.report }}
          UNSAFE_COUNT: ${{ steps.check.outputs.unsafe_count }}
        with:
          script: |
            const marker = '<!-- migration-safety-check -->';
            const unsafe = parseInt(process.env.UNSAFE_COUNT || '0', 10);
            const heading = unsafe > 0
              ? `### Migration Safety Check — needs-rollback-review (${unsafe} pattern${unsafe > 1 ? 's' : ''})`
              : '### Migration Safety Check — rollback-safe';
            const body = [
              marker,
              heading,
              '',
              process.env.REPORT || '(no report)',
              '',
              '> 正規表現ベースの検査 (false-positive 含む)。warning only — block はしない。',
              '> 将来 sqlparser-rs で AST ベースに差し替え予定。',
              '> Refs ippoan/ci-dashboard#137',
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find(c => (c.body || '').startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Apply labels
        if: steps.collect.outputs.added_count != '0'
        uses: actions/github-script@v7
        env:
          UNSAFE_COUNT: ${{ steps.check.outputs.unsafe_count }}
        with:
          script: |
            const unsafe = parseInt(process.env.UNSAFE_COUNT || '0', 10);
            const toAdd = unsafe > 0 ? 'needs-rollback-review' : 'rollback-safe';
            const toRemove = unsafe > 0 ? 'rollback-safe' : 'needs-rollback-review';

            // ラベルが repo に存在しなければ作成
            const labelSpec = {
              'rollback-safe':           { color: '0e8a16', description: 'PR の追加 migration が rollback-safe と判定された' },
              'needs-rollback-review':   { color: 'd93f0b', description: 'PR の追加 migration に rollback 不可な contract パターンを検出' },
            };
            for (const [name, spec] of Object.entries(labelSpec)) {
              try {
                await github.rest.issues.getLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name,
                });
              } catch (e) {
                if (e.status === 404) {
                  await github.rest.issues.createLabel({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    name,
                    color: spec.color,
                    description: spec.description,
                  });
                } else { throw e; }
              }
            }

            // 排他: 反対ラベルが付いていれば剥がす
            try {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                name: toRemove,
              });
            } catch (e) {
              if (e.status !== 404) throw e;
            }
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: [toAdd],
            });

  auto-merge:
    name: Auto Merge
    needs: [test, replay, safety]
    if: github.event_name == 'pull_request' && needs.test.result == 'success' && needs.replay.result == 'success' && (needs.safety.result == 'success' || needs.safety.result == 'skipped')
    uses: ippoan/ci-workflows/.github/workflows/auto-merge.yml@main
    permissions:
      contents: write
      pull-requests: write
      checks: read
    secrets:
      CI_APP_ID: ${{ secrets.CI_APP_ID }}
      CI_APP_PRIVATE_KEY: ${{ secrets.CI_APP_PRIVATE_KEY }}
